<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>Applet 6 - Todo List</title>
    <style>
        .applet-container{
            margin-top: 1rem;
            margin-left: 2rem;
        }

        .completed{
            text-decoration: line-through;
            color: gray;
        }

    </style>
</head>
<body>
    <div id="navbar"></div>
    <div class="container-fluid"  style="max-width: 40%;">
        <h2 class="text-center">To-Do List</h2>
        <label for="combo-box">Select Subject:</label>
        <div style="display: flex; align-items: center;">
            <select id="combo-box" onchange="updateInputValue()">
                <option value="">--Select a Subject--</option>
            </select>
        </div>
        <space>.</space>
        <form>
            <label for="date-picker">Deadline:</label>
            <input type="date" id="date-picker" name="date-picker">
        </form>
        <space>.</space>
        <div class="input-group mb-4">
            <textarea class="form-control" id="todoInput" placeholder="Add Instruction"  rows="3"></textarea>
            <div class="input-group-append" style="margin-left: .5rem;">
                <button class="btn btn-primary" id="addButton">Add</button>
            </div>
        </div>
        <ul id="todoList" class="list-group"></ul>
    </div>

<script src="Insnav.js"></script>
<script src="Todo.js"></script>
</body>
</html>
